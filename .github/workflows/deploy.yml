name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  # Same gate as PRs run (typecheck + lint + test) — one definition, no drift.
  gate:
    name: Gate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  convex-deploy:
    name: Deploy Convex (backend)
    runs-on: ubuntu-latest
    needs: gate
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Convex environment variables
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CLERK_JWT_ISSUER_DOMAIN: ${{ secrets.CLERK_JWT_ISSUER_DOMAIN }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_CHECKOUT_PHONE: ${{ vars.WHATSAPP_CHECKOUT_PHONE }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          APP_URL: ${{ vars.APP_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
        run: |
          CONVEX_ENV_VARS=("CLERK_JWT_ISSUER_DOMAIN" "WHATSAPP_ACCESS_TOKEN" "WHATSAPP_PHONE_NUMBER_ID" "WHATSAPP_CHECKOUT_PHONE" "WHATSAPP_VERIFY_TOKEN" "APP_URL" "RESEND_API_KEY" "EMAIL_FROM")
          for var_name in "${CONVEX_ENV_VARS[@]}"; do
            var_value="${!var_name}"
            if [ -n "$var_value" ]; then
              npx convex env set "$var_name" "$var_value" || echo "Warning: Failed to set $var_name"
            fi
          done

      - name: Deploy Convex
        run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: convex-deploy
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_CLARITY_PROJECT_ID: ${{ vars.VITE_CLARITY_PROJECT_ID }}

      - name: Deploy to Cloudflare Workers
        run: pnpm wrangler deploy --var CONVEX_URL:${{ vars.VITE_CONVEX_URL }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  # Tags `main` with the version in package.json so a version always maps to a
  # commit — the anchor for "what are you running?" in support, and for the
  # release-notes list (86eyqgxna). Runs AFTER the deploy so only what actually
  # shipped ever gets tagged.
  tag:
    name: Tag release
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      # The only job that writes to the repo. Scoped here rather than
      # workflow-wide so the build/deploy jobs stay read-only.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag main with the package.json version
        run: |
          VERSION="$(node -p "require('./package.json').version || ''")"
          if [ -z "$VERSION" ]; then
            echo "::error::package.json has no version field — cannot tag this release."
            exit 1
          fi
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            # Deliberately a WARNING, not a failure. A hotfix to prod at 2am must
            # never be blocked on remembering a version bump — shipping the fix
            # matters more than the tag. But an un-bumped release silently ships
            # under the previous version, which breaks the release-notes
            # "show once per version" contract downstream, so it must be loud.
            echo "::warning::$TAG already exists — this deploy did NOT bump the version in package.json. It has shipped under the previous version, so any new release notes will not be shown to sellers. Bump package.json (YYYY.MM.N) in the next release PR."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $VERSION"
          git push origin "$TAG"
          echo "::notice::Tagged $TAG"
