name: CI

on:
  pull_request:
  push:
    branches:
      - staging
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    # NOTE: this name is the required status check in the `PR gate` ruleset
    # (branch protection on main + staging). Renaming it silently blocks every
    # merge waiting on a check that no longer reports — change the ruleset first.
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Cancel superseded runs on the same PR; queue (never cancel) branch runs,
    # including workflow_call runs from the deploy pipeline.
    concurrency:
      group: ci-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate paraglide files
        run: npx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/paraglide

      # Kept as separate steps so the Actions UI shows which gate failed.
      # `pnpm gate` runs the same four locally — keep them in sync.
      #
      # `biome check`, not `biome lint`: lint alone ignores formatting and
      # import order, so drift accumulated unseen twice (9 files cleaned in
      # PR #70, 66 by Oct 2026). `check` is a superset of `lint` — it adds
      # the formatter and organizeImports — and warnings still don't fail,
      # so the only new red is genuine drift. Fix: `biome check --write <paths>`.
      - name: Lint & format
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Runs here, not just in deploy: `convex-deploy` runs BEFORE the
      # Cloudflare build, so a build-only breakage would otherwise ship a new
      # backend against the old frontend with no rollback step. Needs no
      # VITE_* vars — those are read at runtime, not build time.
      - name: Build
        run: pnpm build
